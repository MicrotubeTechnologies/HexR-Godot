name: CI

# Every push: GDScript tests on the oldest and newest supported Godot (Linux runners, cheap).
# A v* tag, or a manual run (Actions > CI > Run workflow), also builds the native code: the
# Android plugins with their JVM tests, the Windows Bluetooth extension, the Linux, macOS and
# Android stubs, and the addon zip. Those take most of the minutes (macOS counts 10x), so they
# don't run for every push. A v* tag also publishes the zip as a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gdscript:
    name: GDScript tests (Godot ${{ matrix.godot }}, ${{ matrix.physics }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.3", "4.7.2"]
        physics: ["Jolt Physics", "GodotPhysics3D"]
    steps:
      - uses: actions/checkout@v4
      - name: Golden frames are current
        run: python3 tools/gen_golden_frames.py --check
      - name: API reference is current
        run: python3 tools/gen_api_docs.py --check
      - name: Get Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${{ matrix.godot }}-stable_linux.x86_64" godot
      - name: Physics engine
        run: |
          echo "[physics]" > override.cfg
          echo "3d/physics_engine=\"${{ matrix.physics }}\"" >> override.cfg
          cat override.cfg
      - name: Import
        run: ./godot --headless --path . --import || true
      - name: Tests
        run: ./godot --headless --path . -s res://tests/run_tests.gd -- --junit=tests/results.xml
      - name: HexR Remote conformance (Unity probe)
        run: python3 tools/remote_conformance.py --godot ./godot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.godot }}-${{ strategy.job-index }}
          path: tests/results.xml

  android:
    name: Android plugins
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test
        working-directory: android_plugin
        run: ./gradlew --no-daemon :hexr-ble:testDebugUnitTest copyAarsToAddon
      - uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: addons/hexr/android/bin/*.aar
          if-no-files-found: error

  windows:
    name: Windows Bluetooth extension
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # C++/WinRT needs MSVC. On an image whose Visual Studio SCons does not recognise, godot-cpp
    # quietly falls back to MinGW, which cannot build it; pin the image and check below.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SCons
        run: python -m pip install scons==4.11.1
      - name: Build
        working-directory: gdextension
        run: |
          scons platform=windows arch=x86_64 target=template_debug use_mingw=no -j4
          scons platform=windows arch=x86_64 target=template_release use_mingw=no -j4
          if (Get-ChildItem src -Filter *.o) { Write-Error "Built with MinGW, not MSVC"; exit 1 }
      - name: Get Godot
        shell: bash
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          unzip -q godot.zip
      - name: Extension smoke test
        shell: bash
        run: |
          ./Godot_v4.7.2-stable_win64_console.exe --headless --path . --import || true
          ./Godot_v4.7.2-stable_win64_console.exe --headless --path . -s res://tests/smoke/windows_ext_smoke.gd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dlls
          path: addons/hexr/bin/windows/*.dll
          if-no-files-found: error

  stubs:
    name: Extension stub (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          # Android loads the stub so the headset does not log a missing library at start-up;
          # Bluetooth there goes through the HexRBle Java plugin.
          - os: ubuntu-latest
            platform: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install scons==4.11.1
      - name: Build
        working-directory: gdextension
        run: |
          EXTRA=""
          if [ "${{ matrix.platform }}" = "android" ]; then EXTRA="arch=arm64 ndk_version=$(basename "$ANDROID_NDK_LATEST_HOME")"; fi
          scons platform=${{ matrix.platform }} target=template_debug $EXTRA -j4
          scons platform=${{ matrix.platform }} target=template_release $EXTRA -j4
      - name: Stub smoke test
        # The Android stub is checked on a headset: no runner can load an arm64 Android library.
        if: matrix.platform != 'android'
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ZIP=Godot_v4.7.2-stable_linux.x86_64.zip; GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          else
            ZIP=Godot_v4.7.2-stable_macos.universal.zip; GODOT="$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot"
          fi
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$ZIP"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . -s res://tests/smoke/windows_ext_smoke.gd
      - uses: actions/upload-artifact@v4
        with:
          name: stub-${{ matrix.platform }}
          path: addons/hexr/bin/${{ matrix.platform }}/
          if-no-files-found: error

  package:
    name: Addon zip
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [gdscript, android, windows, stubs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$(python3 tools/check_version.py --tag "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(python3 tools/check_version.py)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: android-aars
          path: addons/hexr/android/bin
      - uses: actions/download-artifact@v4
        with:
          name: windows-dlls
          path: addons/hexr/bin/windows
      - uses: actions/download-artifact@v4
        with:
          name: stub-linux
          path: addons/hexr/bin/linux
      - uses: actions/download-artifact@v4
        with:
          name: stub-macos
          path: addons/hexr/bin/macos
      - uses: actions/download-artifact@v4
        with:
          name: stub-android
          path: addons/hexr/bin/android
      - name: Every library the extension lists is there
        run: python3 tools/check_gdextension.py
      - name: Zip
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md addons/hexr/
          zip -qr "HexR-Godot-${{ steps.version.outputs.version }}.zip" addons/hexr
          unzip -l "HexR-Godot-${{ steps.version.outputs.version }}.zip" | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: HexR-Godot-${{ steps.version.outputs.version }}
          path: HexR-Godot-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HexR-Godot-*.zip
          generate_release_notes: true
          # 0.x releases are previews.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
